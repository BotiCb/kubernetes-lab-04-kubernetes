# The same nginx as ../1-nginx-example-pod, but declared as a Deployment, so a
# controller owns the Pod and keeps it alive.  Exposed at
# https://deploy.dani.sapi.click
#
# No TLS annotation is needed: Traefik obtains a Let's Encrypt certificate for
# the Ingress host automatically, and external-dns publishes the A record.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: dani
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx-deploy }
  template:
    metadata:
      labels: { app: nginx-deploy }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-deploy
  namespace: dani
spec:
  selector: { app: nginx-deploy }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-deploy
  namespace: dani
spec:
  ingressClassName: traefik
  rules:
    - host: deploy.dani.sapi.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-deploy
                port:
                  number: 80
  tls:
    - hosts:
        - deploy.dani.sapi.click
