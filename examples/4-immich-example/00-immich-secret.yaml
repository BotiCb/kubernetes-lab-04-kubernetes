# PostgreSQL credentials for Immich.
#
# Both the Immich server and the PostgreSQL container read the password from
# this Secret under the key DB_PASSWORD.
#
# !!! CHANGE THE PASSWORD BEFORE APPLYING !!!
# It is reachable only inside the cluster (Postgres is never exposed through the
# Ingress), but the placeholder below is public.
#   kubectl -n dani create secret generic immich-secrets \
#     --from-literal=DB_PASSWORD="$(openssl rand -hex 16)" --dry-run=client -o yaml \
#     | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: immich-secrets
  namespace: dani
  labels:
    app.kubernetes.io/part-of: immich
type: Opaque
stringData:
  DB_PASSWORD: "change-me-immich-db-password"
