# Immich server: the API + web UI + background workers, listening on :2283.
#
# The whole media library (uploads, generated thumbnails/encoded video, profile
# pictures, the on-disk `library`) lives under /data on one PVC, exactly like
# `${UPLOAD_LOCATION}:/data` in the compose file.  Immich creates the subfolders
# itself on first boot.
#
# strategy: Recreate -- the /data volume is ReadWriteOnce and node-local.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: dani
  labels:
    app.kubernetes.io/part-of: immich
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 12Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: dani
  labels:
    app: immich-server
    app.kubernetes.io/part-of: immich
spec:
  # The server is stateful-ish (single writer to /data + the job queue); keep 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Wait for the database and queue so the server doesn't CrashLoop on first
      # boot.  (Immich also retries on its own; this just makes startup quiet.)
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command:
            - sh
            - -c
            - 'until nc -z -w 2 postgres 5432; do echo "waiting for postgres"; sleep 2; done'
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-redis
          image: busybox:1.37
          command:
            - sh
            - -c
            - 'until nc -z -w 2 redis 6379; do echo "waiting for redis"; sleep 2; done'
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          ports:
            - name: http
              containerPort: 2283
          env:
            - name: TZ
              value: "Etc/UTC"
            # These match the Service names above; the Immich defaults are
            # `database` / `redis`, so we set them explicitly for clarity.
            - name: DB_HOSTNAME
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: immich
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOSTNAME
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
          securityContext:
            allowPrivilegeEscalation: false
          # /api/server/ping is the image's own healthcheck endpoint (public,
          # returns {"res":"pong"}).  The startupProbe gives it a long first boot.
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1000m"
              memory: 2Gi
          volumeMounts:
            - name: library
              mountPath: /data
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: dani
  labels:
    app: immich-server
    app.kubernetes.io/part-of: immich
spec:
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
